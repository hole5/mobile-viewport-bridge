<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MVB Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="brand">Lumen Kids测试</p>
      <h1 class="title">今日亲子时光</h1>
      <p class="sub">在手机视窗里点选文字、改颜色，再应用到代码。</p>
    </header>
    <section class="cards">
      <article class="card">
        <img
          class="cover"
          src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=600&q=80"
          alt="kids"
        />
        <h2>户外探索</h2>
        <p>周末公园散步，收集树叶与光影。</p>
      </article>
      <article class="card">
        <img
          class="cover"
          src="https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=600&q=80"
          alt="play"
        />
        <h2>手作工坊</h2>
        <p>黏土与彩纸，做出今天的小作品。</p>
      </article>
    </section>
    <button class="cta" type="button">开始今日任务</button>
  </body>
</html>
